<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <!--
      手机竖屏为主（Q4/Q8：单手拿着）。
       maximum-scale=1 + user-scalable=no 防止误触双指缩放，
       viewport-fit=cover 让内容铺到安全区。
    -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#ff6b35" />

    <title>日麻算番算分</title>
    <meta name="description" content="日本麻将赛后算番算分工具。录入和牌手牌，输出役种、番数、符数、点数与四家支付明细。离线可用。" />

    <!-- ============ PWA ============ -->
    <!--
      manifest 让浏览器知道这是可安装的应用。
      ⚠️ 相对路径：这样部署到 GitHub Pages 的任意子路径都能用。
    -->
    <link rel="manifest" href="./manifest.webmanifest" />

    <!-- iOS 不吃 manifest 的图标，要单独声明；且 iOS 不支持透明图标 -->
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="日麻算分" />

    <!-- Android：地址栏主题色跟随 -->
    <meta name="mobile-web-app-capable" content="yes" />
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>

    <!--
      注册 Service Worker —— 这是「离线可用」的关键。

      为什么必须用它（而不是把 HTML 发给朋友）：
        Android 上 `file://` 协议**无法注册 Service Worker**，
        而从文件管理器打开 HTML 走的是 `content://`，相对路径资源会全部失效。
        唯一可靠的路径是 HTTPS 页面 + SW 缓存：
        用户联网打开一次，之后完全离线可用。

      失败时静默处理：SW 只是增强，注册不上也不该影响应用本身。
    -->
    <script>
      if ("serviceWorker" in navigator) {
        window.addEventListener("load", function () {
          // 相对路径 "./sw.js" —— 部署到子路径时也对
          navigator.serviceWorker.register("./sw.js", { scope: "./" }).catch(function (err) {
            // 只在控制台提示，界面上不打扰用户
            console.info("[SW] 注册失败（不影响使用）：", err && err.message);
          });
        });
      }
    </script>
  </body>
</html>
